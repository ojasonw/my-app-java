name: Java CI/CD com Docker e GitOps

# Triggers: O que dispara a action
on:
  push:
    branches: [ "main" ] # Para pushes em main, apenas build e teste
    tags: [ 'v*.*.*' ] # Disparar Builds, Push Docker e PR GitOps quando uma tag vX.Y.Z for criada e enviada
  pull_request:
    branches: [ "main" ] # Para PRs, apenas build e teste

jobs:
  ###########################################
  # Job 1: Build e Teste da Aplicação Java #
  ###########################################
  build_and_test:
    name: Build e Teste
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout do código da aplicação"
        uses: actions/checkout@v3

      - name: "Configura o Java (JDK)"
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: "Roda os testes com Maven"
        run: mvn test -DskipTests

      - name: "Empacota a aplicação com Maven"
        run: mvn package -DskipTests

  ##################################################
  # Job 2: Build e Push da Imagem Docker          #
  # Este job só roda se o primeiro for bem sucedido #
  # E APENAS SE FOR UM PUSH DE TAG (vX.Y.Z).        #
  ##################################################
  build_and_push_docker:
    name: Build e Push da Imagem Docker
    runs-on: ubuntu-latest
    needs: build_and_test
    # Condição: SÓ executa em pushes de tags (releases manuais)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    # Define a versão da imagem: usa a tag Git
    env:
      IMAGE_VERSION: ${{ github.ref_name }} # Quando o if for true, github.ref_name será a tag

    steps:
      - name: "Checkout do código da aplicação"
        uses: actions/checkout@v3

      - name: "Configura o QEMU (para build multi-plataforma, opcional mas bom)"
        uses: docker/setup-qemu-action@v2

      - name: "Configura o Docker Buildx"
        uses: docker/setup-buildx-action@v2

      - name: "Login no Docker Hub"
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Build e Push da imagem"
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # A imagem será tagueada APENAS com a tag Git (ex: ojasonw/joga-together-backend:v1.0.0)
          tags: ojasonw/joga-together-backend:${{ env.IMAGE_VERSION }}

  ########################################################
  # Job 3: Abre um PR no Repositório GitOps             #
  # Atualiza a tag da imagem no ambiente de dev.        #
  # E APENAS SE FOR UM PUSH DE TAG (vX.Y.Z).            #
  ########################################################
  update_gitops_repo:
    name: Atualiza Repositório GitOps
    runs-on: ubuntu-latest
    needs: build_and_push_docker
    # Condição: SÓ executa se for um push de tag (releases manuais)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    # A versão da imagem é a tag Git
    env:
      IMAGE_VERSION: ${{ github.ref_name }}

    steps:
      - name: "Checkout do repositório Homelab GitOps"
        uses: actions/checkout@v4
        with:
          repository: ojasonw/homelab-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: homelab-gitops

      - name: "Checkout do repositório Platform GitOps"
        uses: actions/checkout@v4
        with:
          repository: ojasonw/platform-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: platform-gitops

      - name: "Instala o yq"
        run: |
          sudo wget -O /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: "Atualiza a tag da imagem no Homelab GitOps"
        run: |
          cd homelab-gitops/infra/joga-together/base
          yq -i '(.images[] | select(.name == "ojasonw/joga-together-backend") | .newTag) = strenv(IMAGE_VERSION)' kustomization.yaml

      - name: "Atualiza a tag da imagem no Platform GitOps"
        run: |
          cd platform-gitops/apps/my-service/overlays/dev
          yq -i '(.images[] | select(.name == "ojasonw/joga-together-backend") | .newTag) = strenv(IMAGE_VERSION)' kustomization.yaml

      - name: "Cria um Pull Request no Homelab GitOps"
        uses: peter-evans/create-pull-request@v6
        with:
          path: homelab-gitops
          token: ${{ secrets.GITOPS_PAT }}
          commit-message: "chore: update joga-together-backend image to ${{ env.IMAGE_VERSION }}"
          title: "CI: Atualiza joga-together-backend para ${{ env.IMAGE_VERSION }}"
          body: |
            Atualização automática da imagem pela GitHub Action no repositório Homelab GitOps.

            **Image:** `ojasonw/joga-together-backend:${{ env.IMAGE_VERSION }}`
          branch: "update-joga-together-backend-homelab-${{ env.IMAGE_VERSION }}"
          base: "main"
          delete-branch: true

      - name: "Cria um Pull Request no Platform GitOps"
        uses: peter-evans/create-pull-request@v6
        with:
          path: platform-gitops
          token: ${{ secrets.GITOPS_PAT }}
          commit-message: "chore: update joga-together-backend image to ${{ env.IMAGE_VERSION }}"
          title: "CI: Atualiza joga-together-backend para ${{ env.IMAGE_VERSION }}"
          body: |
            Atualização automática da imagem pela GitHub Action no repositório Platform GitOps.

            **Image:** `ojasonw/joga-together-backend:${{ env.IMAGE_VERSION }}`
          branch: "update-joga-together-backend-platform-${{ env.IMAGE_VERSION }}"
          base: "main"
          delete-branch: true
